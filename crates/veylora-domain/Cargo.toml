[package]
name = "veylora-domain"
description = "Platform-independent Veylora RIP domain contracts"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qcms = { version = "0.3", default-features = false, features = ["iccv4-enabled", "cmyk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
