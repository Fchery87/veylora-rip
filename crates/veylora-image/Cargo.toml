[package]
name = "veylora-image"
description = "Bounded, metadata-aware PNG source import for Veylora RIP"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
veylora-domain = { path = "../veylora-domain" }
