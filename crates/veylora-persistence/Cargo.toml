[package]
name = "veylora-persistence"
description = "Veylora RIP durable append-only store for immutable job snapshots and submission attempts"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veylora-domain = { path = "../veylora-domain" }
veylora-color = { path = "../veylora-color" }
