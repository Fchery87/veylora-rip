veylora-image = { path = "../veylora-image" }
veylora-layout = { path = "../veylora-layout" }
veylora-persistence = { path = "../veylora-persistence" }
veylora-render = { path = "../veylora-render" }
veylora-separation = { path = "../veylora-separation" }
