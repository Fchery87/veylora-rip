description = "Headless application services: job creation, preflight, rendering and artifact inspection"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veylora-device = { path = "../veylora-device" }
