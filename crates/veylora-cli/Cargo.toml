[package]
name = "veylora-cli"
description = "Headless Veylora RIP command-line interface"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
veylora-domain = { path = "../veylora-domain" }
veylora-diagnostics = { path = "../veylora-diagnostics" }
veylora-device = { path = "../veylora-device" }
veylora-image = { path = "../veylora-image" }
veylora-workflow = { path = "../veylora-workflow" }
veylora-release = { path = "../veylora-release" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
veylora-persistence = { path = "../veylora-persistence" }
