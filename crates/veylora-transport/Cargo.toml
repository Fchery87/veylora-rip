[package]
name = "veylora-transport"
description = "Printer-independent artifact transports and diagnostic file sink"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
veylora-domain = { path = "../veylora-domain" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
