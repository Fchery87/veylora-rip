[package]
name = "veylora-app"
description = "Veylora RIP Tauri 2 desktop shell: typed commands over application services"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veylora-device = { path = "../veylora-device" }
veylora-domain = { path = "../veylora-domain" }
veylora-workflow = { path = "../veylora-workflow" }

[dev-dependencies]
veylora-transport = { path = "../veylora-transport" }

[lib]
name = "veylora_app_lib"
path = "src/lib.rs"
