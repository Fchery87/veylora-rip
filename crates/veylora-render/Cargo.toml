[package]
name = "veylora-render"
description = "Bounded, cancellable, printer-independent band rendering with retained stage artifacts"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veylora-device = { path = "../veylora-device" }
veylora-domain = { path = "../veylora-domain" }
veylora-image = { path = "../veylora-image" }
veylora-screen = { path = "../veylora-screen" }
veylora-separation = { path = "../veylora-separation" }
